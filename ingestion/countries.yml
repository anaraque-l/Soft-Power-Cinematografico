# Países-alvo do estudo.
#
# Critério de seleção: cobrir todos os continentes e incluir tanto potências
# cinematográficas consolidadas quanto países com produção relevante e baixa
# projeção externa — o contraste é justamente o que o índice quer medir.
#
# `iso` segue ISO 3166-1 alfa-2 e é a chave de junção com TMDB, Wikidata,
# World Bank e UNESCO. Alterar aqui muda o escopo de toda a ingestão.

