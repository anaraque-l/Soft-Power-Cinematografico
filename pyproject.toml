[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soft-power-cinematografico"
version = "0.1.0"
description = "Índice de Soft Power Cinematográfico — pipeline de dados e análise"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ana Raquel" }]

dependencies = [
    "httpx>=0.27",           # cliente HTTP com timeout e retry explícitos
    "tenacity>=8.2",         # backoff exponencial nas chamadas de API
    "pydantic>=2.7",         # validação do contrato das APIs na fronteira
    "pydantic-settings>=2.3", # configuração tipada a partir do ambiente
    "pyyaml>=6.0",           # leitura da lista de países-alvo
    "pandas>=2.2",
    "pyarrow>=16.0",         # escrita dos snapshots em parquet
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",  # driver Postgres
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",  # o cliente do TMDB é async; os testes também
    "respx>=0.21",           # mock de HTTP para testar clientes de API sem rede
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

# --- Ruff: lint + format num binário só ---------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort (ordenação de imports)
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # flake8-bugbear (armadilhas comuns)
    "SIM",     # flake8-simplify
    "RUF",     # regras do próprio ruff
]
ignore = [
    # Documentação e mensagens são em português, com pontuação tipográfica
    # (×, —, aspas curvas). "Caractere ambíguo" aqui é falso positivo em série.
    "RUF001", "RUF002", "RUF003",
]

# --- Pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    # Testes escritos antes da implementação (convenção `[VOCÊ]` do PLANO):
    # rodam localmente como lista de tarefas, e o CI os desmarca com
    # `-m "not pendente"` para não pintar de vermelho trabalho não iniciado.
    "pendente: exercício ainda não implementado",
]
